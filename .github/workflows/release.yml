name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - run: cargo test --locked
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/fork" "dist/fork-agent-$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package installer and optional virtual computer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sed "s/^version=.*/version=\${FORK_CLI_VERSION:-${RELEASE_TAG#v}}/" install.sh > dist/install.sh
          tar -czf dist/virtual-computer.tar.gz virtual-computer/src virtual-computer/package.json virtual-computer/package-lock.json virtual-computer/README.md
          cd dist
          sha256sum fork-agent-* virtual-computer.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "Fork CLI $RELEASE_TAG" --generate-notes
